---
layout: default
---
{% assign feed_entries = page.entries | default: site.latest_month_entries %}
{% assign feed_heading = page.eyebrow | default: site.latest_month_label %}
<header class="page-header">
  <h1>{{ feed_heading }}</h1>
</header>

<div class="entry-list">
  {% for entry in feed_entries %}
    {% include entry-preview.html entry=entry %}
  {% endfor %}
</div>
