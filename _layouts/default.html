<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.date %}{{ page.date | date: "%B %-d, %Y" }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to writing</a>
    <div class="site-shell">
      {% include archive-nav.html %}
      <main id="main-content" class="main-content" tabindex="-1">
        {{ content }}
      </main>
    </div>
  </body>
</html>
