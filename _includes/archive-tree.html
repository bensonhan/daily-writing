<div class="archive-tree">
  {% for archive_year in site.archive_tree %}
    <details class="archive-year"{% if archive_year.year == site.latest_year %} open{% endif %}>
      <summary>{{ archive_year.year }}</summary>
      <ul>
        {% for archive_month in archive_year.months %}
          <li>
            <a href="{{ archive_month.url | relative_url }}">{{ archive_month.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </details>
  {% endfor %}
</div>
