<aside class="archive-rail" aria-label="Site and archive navigation">
  <div class="rail-header">
    <a class="identity" href="{{ '/' | relative_url }}" aria-label="BH daily writing home">
      <img class="identity-journal" src="{{ '/assets/images/journal-mark.png' | relative_url }}" alt="" width="46" height="46">
      <span class="identity-initials">BH</span>
    </a>
    <button class="rail-toggle" type="button" data-archive-toggle aria-controls="desktop-archive" aria-expanded="true" aria-label="Collapse archive sidebar">
      <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
        <path d="m9.5 4.5-3.5 3.5 3.5 3.5" />
      </svg>
    </button>
  </div>

  <nav class="desktop-archive" id="desktop-archive" aria-label="Writing archive">
    {% include archive-tree.html %}
  </nav>

  <details class="mobile-archive">
    <summary>Archive</summary>
    <nav aria-label="Writing archive">
      {% include archive-tree.html %}
    </nav>
  </details>
</aside>
