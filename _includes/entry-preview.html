{% assign entry = include.entry %}
<article class="entry-preview">
  <time class="date-lockup" datetime="{{ entry.date | date: '%Y-%m-%d' }}">
    <span>{{ entry.date | date: "%a" | upcase }}</span>
    <strong>{{ entry.date | date: "%-d" }}</strong>
  </time>
  <div class="entry-excerpt">
    {{ entry.excerpt | markdownify }}
  </div>
  <a class="entry-permalink" href="{{ entry.url | relative_url }}" aria-label="Read entry from {{ entry.date | date: '%A, %B %-d, %Y' }}"></a>
</article>
